name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check and package
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Build # Generate types
        run: pnpm run build

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm --filter=extension exec vitest run

      - name: Build documentation
        run: pnpm run docs:build

      - name: Install Playwright Chromium
        run: pnpm --filter=extension exec playwright install --with-deps chromium

      - name: Production Chromium E2E Tests
        run: pnpm --filter=extension exec vitest run --config vitest.e2e.config.ts

      - name: Package checked build
        run: |
          VERSION=$(node -p 'require("./extension/package.json").version')
          ASSET_NAME="breeze-v${VERSION}"
          mkdir -p release-assets
          (cd extension/.output/chrome-mv3 && zip -qr "$GITHUB_WORKSPACE/release-assets/${ASSET_NAME}-chrome.zip" .)
          git archive --format=zip --prefix="${ASSET_NAME}/" --output="release-assets/${ASSET_NAME}-source.zip" HEAD
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Upload checked release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Upload E2E failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-traces
          path: extension/test-results/
          if-no-files-found: ignore
          retention-days: 7
